name: Build docker image and push to ECR

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
      dockerfile_path:
        description: 'Dockerfile directory'
        required: true
        type: string

jobs:
  BuildDockerArm64:
    runs-on:
      - codebuild-github-runners-${{ github.run_id }}-${{ github.run_attempt }}
      - image:arm-3.0

    steps:
      - uses: actions/checkout@v3

      - name: Login to AWS
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push docker image to ECR
        id: build-and-push
        env:
          AWS_ECR_CRAWLERS_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Building docker images w/ tags ${{ inputs.image_tag }}"
          docker buildx build --load --platform linux/arm64 -t ${{ env.AWS_ECR_CRAWLERS_REGISTRY }}/${{ inputs.ecr_repository }}:${{ inputs.image_tag }} -f ${{inputs.dockerfile_path}} .
          docker push ${{ env.AWS_ECR_CRAWLERS_REGISTRY }}/${{ inputs.ecr_repository }}:${{ inputs.image_tag }}
